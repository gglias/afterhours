<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>After hours: social preview (1200×630)</title>
<!-- Source of assets/og.png. Render: headless Chrome, --window-size=1200,630, --screenshot. desk.png = the hero desk, lit, transparent background. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400..600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #f3f3f1; font-family: "Inter", sans-serif;
    background: radial-gradient(circle, rgb(255 255 255 / 0.09) 1.1px, transparent 1.4px) 0 0 / 28px 28px, #09090a; }
  .glow { position: absolute; inset: 0; overflow: hidden; }
  .glow::before, .glow::after { content: ""; position: absolute; border-radius: 50%; filter: blur(80px); }
  .glow::before { width: 900px; height: 900px; left: -420px; bottom: -560px; background: radial-gradient(circle, rgb(255 91 31 / 0.5), transparent 62%); }
  .glow::after { width: 640px; height: 640px; right: -260px; top: -340px; background: radial-gradient(circle, rgb(196 33 11 / 0.4), transparent 62%); }
  .mono { font-family: "Geist Mono", monospace; font-size: 15px; color: #9b9ba1; }
  .top { position: absolute; left: 64px; right: 64px; top: 48px; display: flex; justify-content: space-between; }
  .top .open { color: #d0d0d5; } .top .open::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #4ade80; margin-right: 10px; }
  .frame { position: absolute; left: 64px; top: 150px; padding: 8px 18px 14px; }
  .frame::before { content: ""; position: absolute; inset: 0; border: 2px solid #0d99ff; }
  .frame .label { position: absolute; left: 0; bottom: calc(100% + 10px); font-family: "Geist Mono", monospace; font-size: 15px; color: #0d99ff; }
  .frame i { position: absolute; width: 12px; height: 12px; background: #09090a; border: 2px solid #0d99ff; }
  .frame .tl { left: -6px; top: -6px; } .frame .tr { right: -6px; top: -6px; } .frame .bl { left: -6px; bottom: -6px; } .frame .br { right: -6px; bottom: -6px; }
  .frame .size { position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%); padding: 4px 8px; border-radius: 4px; background: #0d99ff; color: #fff; font-family: "Geist Mono", monospace; font-size: 14px; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 350; font-size: 128px; line-height: 0.9; letter-spacing: -0.045em; white-space: nowrap; }
  .lead { position: absolute; left: 64px; top: 372px; width: 560px; font-family: "Bricolage Grotesque", sans-serif; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em; }
  .lead span { color: #9b9ba1; }
  .pills { position: absolute; left: 64px; bottom: 52px; display: flex; gap: 10px; }
  .pills span { padding: 9px 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.13); background: rgb(255 255 255 / 0.05); font-family: "Geist Mono", monospace; font-size: 14px; color: #d0d0d5; }
  .card { position: absolute; right: 56px; top: 116px; width: 480px; height: 420px; padding: 10px; border-radius: 22px; border: 1px solid rgb(255 255 255 / 0.07);
    background: linear-gradient(180deg, rgb(255 255 255 / 0.045), rgb(255 255 255 / 0.015)), #121214; }
  .art { position: relative; height: 100%; border-radius: 14px; overflow: hidden; background: #efefec; }
  .art img { position: absolute; width: 640px; left: -136px; top: -86px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <p class="top mono"><span>Issue 01 · Autumn 2026</span><span class="open">Open after 19:00 Athens</span></p>
  <div class="frame"><span class="label">Masthead / Issue 01</span><h1>After hours</h1><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="size">by Greg Glias</span></div>
  <p class="lead">UX audits, redesign sprints &amp; Figma → WordPress, <span>in the evenings.</span></p>
  <p class="pills"><span>Remote</span><span>Async</span><span>Thessaloniki, GR</span></p>
  <div class="card"><div class="art"><img src="desk.png" alt=""></div></div>
</body>
</html>
